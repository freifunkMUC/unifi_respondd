[tool.ruff]
line-length = 120
# Vendored third-party code (MIT licensed, kept byte-for-byte identical to
# upstream), not held to this project's lint rules.
exclude = ["unifi_respondd/vendors/omada_api"]

[tool.ruff.lint]
# Enable pycodestyle (E, W), pyflakes (F), and isort (I)
select = ["E", "F", "W", "I"]
# Ignore line too long since we set line-length above
ignore = ["E501"]
