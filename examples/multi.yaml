# Several controllers in one instance, each with its own backend and credentials.
# Keys shared by several controllers can be reused with a YAML anchor.
defaults: &defaults
  ssid_regex: .*freifunk.*
  nodelist: https://MAPURL/data/meshviewer.json
  ssl_verify: True

unknown_location: report  # default of all controllers for APs at 0/0: report, omit or skip
controllers:
  - name: unifi  # optional, used in the logs
    backend: unifi
    <<: *defaults
    controller_url: unifi.lan
    controller_port: 8443
    username: ubnt
    password: ubnt
    version: v5
    offloader_mac:
        SiteName: 00:00:00:00:00:00
  - name: omada
    backend: omada
    <<: *defaults
    controller_url: https://omada.lan:8043
    username: omada
    password: omada
    offloader_mac:
        SiteName: 00:00:00:00:00:00
    unknown_location: omit
  - name: uisp
    backend: uisp
    controller_url: https://uisp.lan/nms/api/v2.1
    token: t-o-k-en

multicast_enabled: false
multicast_address: ff05::2:1001
multicast_port: 1001
unicast_address: fe80::68ff:94ff:fe00:1504
unicast_port: 10001
interface: eth0
verbose: true
logging_config:
    formatters:
      standard:
        format: '%(asctime)s,%(msecs)d %(levelname)-8s [%(filename)s:%(lineno)d] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: standard
    root:
      handlers:
      - console
      level: DEBUG
    version: 1
