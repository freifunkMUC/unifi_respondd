name: Publish Python Distributions to PyPI and TestPyPI

on:
  push:
    tags:
      - "v*"
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Python Distributions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # required for git describe

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel build

      - name: Get version from git tag
        run: |
          sed -i s/VERSION/$(git describe --always --tags | sed 's/-\([0-9]\+\)-\(g[a-f0-9]\+\)$/.dev\1+\2/')/g setup.py
          cat setup.py

      - name: Build distributions
        run: python -m build --sdist --wheel --outdir dist/

  publish-testpypi:
    runs-on: ubuntu-latest
    name: Publish to TestPyPI
    if: github.event_name == 'push'
    needs:
      - build
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # required for git describe

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v 6.3.0
        with:
          python-version: 3.13
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel build

      - name: Get version from git tag
        run: |
          sed -i s/VERSION/$(git describe --always --tags | sed 's/-\([0-9]\+\)-\(g[a-f0-9]\+\)$/.dev\1+\2/')/g setup.py
          cat setup.py

      - name: Build distributions
        run: python -m build --sdist --wheel --outdir dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: false

  publish-pypi:
    runs-on: ubuntu-latest
    name: Publish to PyPI
    # only publish to PyPI when a tag was created
    if: contains(github.ref, 'refs/tags')
    needs:
      - build
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # required for git describe

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v 6.3.0
        with:
          python-version: 3.13
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel build

      - name: Get version from git tag
        run: |
          sed -i s/VERSION/$(git describe --always --tags | sed 's/-\([0-9]\+\)-\(g[a-f0-9]\+\)$/.dev\1+\2/')/g setup.py
          cat setup.py

      - name: Build distributions
        run: python -m build --sdist --wheel --outdir dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
